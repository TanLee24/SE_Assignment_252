<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Lịch sử đỗ xe | IoT-SPMS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "surface": "#10131b", "surface-dim": "#10131b", "surface-container-lowest": "#0a0e15",
                    "surface-container-low": "#181c23", "surface-container": "#1c2027",
                    "surface-container-high": "#262a32", "surface-container-highest": "#31353d",
                    "surface-variant": "#31353d", "surface-bright": "#353941",
                    "on-surface": "#dfe2ed", "on-surface-variant": "#c3c6d7",
                    "primary": "#b3c5ff", "primary-container": "#2f6cf0", "primary-dim": "#2f6cf0",
                    "on-primary": "#002b75", "on-primary-container": "#fffcff",
                    "outline-variant": "#424654", "outline": "#8d90a0",
                    "tertiary": "#00dbe7", "tertiary-container": "#008188",
                    "error": "#ffb4ab", "error-container": "#93000a",
                    "secondary": "#b3c5ff", "secondary-container": "#244592",
                    "background": "#10131b",
                },
                fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"], label: ["Manrope"] }
            }}
        }
    </script>
    <style>
        body { background-color: #10131b; color: #dfe2ed; font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card { background: rgba(49, 53, 61, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(66, 70, 84, 0.15); }
    </style>
    <link href="../theme.css" rel="stylesheet"/>
    <script src="../theme.js"></script>
</head>
<body class="bg-surface selection:bg-primary-container selection:text-on-primary-container">

<header id="user-nav" class="fixed top-0 w-full z-50 bg-[#10131b]/80 backdrop-blur-2xl border-b border-[#424654]/15 shadow-[0px_20px_40px_rgba(47,108,240,0.08)]"></header>

<main class="pt-24 lg:pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-[1400px] mx-auto min-h-screen">
    <section class="mb-10">
        <h1 class="font-headline text-3xl sm:text-5xl font-bold tracking-tighter mb-2">Lịch sử đỗ xe</h1>
        <p class="text-on-surface-variant text-sm lg:text-base">Tất cả các phiên đỗ xe đã được ghi nhận bằng thẻ định danh của bạn.</p>
    </section>

    <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-outline-variant/15 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
                    <input type="text" id="historySearch" placeholder="Tìm biển số, ngày..." class="bg-surface-container-high border-none rounded-full py-2 pl-10 pr-4 text-xs w-64 focus:ring-1 focus:ring-primary">
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="h-9 px-4 rounded-full bg-surface-container-high border border-outline-variant/30 text-[10px] font-bold uppercase tracking-widest hover:bg-surface-bright transition-all">Xuất báo cáo (CSV)</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-surface-container-low text-[10px] text-on-surface-variant uppercase tracking-widest font-black">
                    <tr>
                        <th class="px-6 py-4">Mã phiên</th>
                        <th class="px-6 py-4">Biển số</th>
                        <th class="px-6 py-4">Vào</th>
                        <th class="px-6 py-4">Ra</th>
                        <th class="px-6 py-4">Vị trí</th>
                        <th class="px-6 py-4">Phí</th>
                        <th class="px-6 py-4">Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="fullHistoryTableBody" class="text-sm divide-y divide-outline-variant/10">
                    <!-- Rows will be injected -->
                </tbody>
            </table>
        </div>
        <div id="fullHistoryEmpty" class="hidden p-20 text-center flex flex-col items-center">
            <span class="material-symbols-outlined text-6xl text-on-surface-variant/20 mb-4">folder_off</span>
            <p class="text-on-surface-variant">Không tìm thấy dữ liệu đỗ xe nào.</p>
        </div>
    </div>
</main>

<script src="shared.js"></script>
<script>
    const user = requireUser();
    if (user) {
        injectNavbar('history');
        loadFullHistory();
    }

    async function loadFullHistory() {
        const sessions = await loadSessions();
        const userSessions = sessions.filter(s => s.cardId === user.cardId);
        const sortedSessions = userSessions.sort((a, b) => new Date(b.entryTime) - new Date(a.entryTime));
        
        renderTable(sortedSessions);

        document.getElementById('historySearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = sortedSessions.filter(s => 
                s.plateNumber.toLowerCase().includes(q) || 
                formatDate(s.entryTime).includes(q) ||
                s.id.toLowerCase().includes(q)
            );
            renderTable(filtered);
        });
    }

    function renderTable(data) {
        const tableBody = document.getElementById('fullHistoryTableBody');
        const historyEmpty = document.getElementById('fullHistoryEmpty');
        
        if (data.length > 0) {
            tableBody.innerHTML = '';
            data.forEach(s => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-white/5 transition-all';
                
                let statusBadge = '';
                if (s.status === 'active') {
                    statusBadge = '<span class="px-2 py-0.5 rounded-full bg-primary/20 text-primary text-[10px] font-bold">Đang hoạt động</span>';
                } else if (s.status === 'completed') {
                    statusBadge = '<span class="px-2 py-0.5 rounded-full bg-tertiary/20 text-tertiary text-[10px] font-bold">Đã hoàn thành</span>';
                } else {
                    statusBadge = `<span class="px-2 py-0.5 rounded-full bg-error/20 text-error text-[10px] font-bold">Lỗi: ${s.exceptionNote || 'Không rõ'}</span>`;
                }

                row.innerHTML = `
                    <td class="px-6 py-4 font-mono text-[10px] text-on-surface-variant">${s.id}</td>
                    <td class="px-6 py-4 font-bold font-mono">${s.plateNumber}</td>
                    <td class="px-6 py-4">
                        <div class="font-bold">${formatDate(s.entryTime)}</div>
                        <div class="text-[10px] text-on-surface-variant">${formatTime(s.entryTime)}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-bold">${formatDate(s.exitTime)}</div>
                        <div class="text-[10px] text-on-surface-variant">${formatTime(s.exitTime)}</div>
                    </td>
                    <td class="px-6 py-4"><span class="px-2 py-0.5 rounded bg-surface-container-highest text-[10px] font-bold">Khu ${s.zone} - Ô ${s.spotId}</span></td>
                    <td class="px-6 py-4 text-tertiary font-bold">${formatVND(s.feeVnd)}</td>
                    <td class="px-6 py-4">${statusBadge}</td>
                `;
                tableBody.appendChild(row);
            });
            historyEmpty.classList.add('hidden');
        } else {
            tableBody.innerHTML = '';
            historyEmpty.classList.remove('hidden');
        }
    }
</script>
</body>
</html>
