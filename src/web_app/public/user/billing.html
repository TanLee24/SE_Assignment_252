<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hóa đơn & Thanh toán | IoT-SPMS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "surface": "#10131b", "surface-dim": "#10131b", "surface-container-lowest": "#0a0e15",
                    "surface-container-low": "#181c23", "surface-container": "#1c2027",
                    "surface-container-high": "#262a32", "surface-container-highest": "#31353d",
                    "surface-variant": "#31353d", "surface-bright": "#353941",
                    "on-surface": "#dfe2ed", "on-surface-variant": "#c3c6d7",
                    "primary": "#b3c5ff", "primary-container": "#2f6cf0", "primary-dim": "#2f6cf0",
                    "on-primary": "#002b75", "on-primary-container": "#fffcff",
                    "outline-variant": "#424654", "outline": "#8d90a0",
                    "tertiary": "#00dbe7", "tertiary-container": "#008188",
                    "error": "#ffb4ab", "error-container": "#93000a",
                    "secondary": "#b3c5ff", "secondary-container": "#244592",
                    "background": "#10131b",
                },
                fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"], label: ["Manrope"] }
            }}
        }
    </script>
    <style>
        body { background-color: #10131b; color: #dfe2ed; font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card { background: rgba(49, 53, 61, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(66, 70, 84, 0.15); }
    </style>
    <link href="../theme.css" rel="stylesheet"/>
    <script src="../theme.js"></script>
</head>
<body class="bg-surface selection:bg-primary-container selection:text-on-primary-container">

<header id="user-nav" class="fixed top-0 w-full z-50 bg-[#10131b]/80 backdrop-blur-2xl border-b border-[#424654]/15 shadow-[0px_20px_40px_rgba(47,108,240,0.08)]"></header>

<main class="pt-24 lg:pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-[1400px] mx-auto min-h-screen">
    <section class="mb-10">
        <h1 class="font-headline text-3xl sm:text-5xl font-bold tracking-tighter mb-2">Hóa đơn & Thanh toán</h1>
        <p class="text-on-surface-variant text-sm lg:text-base">Quản lý các hóa đơn gửi xe định kỳ và lịch sử giao dịch qua BKPay.</p>
    </section>

    <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-outline-variant/15 flex items-center justify-between">
            <h3 class="text-lg font-bold">Lịch sử giao dịch & Hóa đơn</h3>
            <div class="flex items-center gap-2">
                <span class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">
                    <span class="w-2 h-2 bg-error rounded-full"></span> Chưa thanh toán
                </span>
                <span class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-4">
                    <span class="w-2 h-2 bg-tertiary rounded-full"></span> Đã thanh toán
                </span>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-surface-container-low text-[10px] text-on-surface-variant uppercase tracking-widest font-black">
                    <tr>
                        <th class="px-6 py-4">Kỳ thanh toán</th>
                        <th class="px-6 py-4">Mã hóa đơn</th>
                        <th class="px-6 py-4">Số tiền</th>
                        <th class="px-6 py-4">Trạng thái</th>
                        <th class="px-6 py-4">Ngày giao dịch</th>
                        <th class="px-6 py-4 text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="billingTableBody" class="text-sm divide-y divide-outline-variant/10">
                    <!-- Rows will be injected -->
                </tbody>
            </table>
        </div>
        <div id="billingEmpty" class="hidden p-12 text-center text-on-surface-variant">
            Chưa có hóa đơn nào được ghi nhận cho tài khoản của bạn.
        </div>
    </div>
</main>

<script src="shared.js"></script>
<script src="../pricing/assets/scripts/pricing-services.js"></script>
<script type="module" src="../pricing/assets/scripts/billing-page.js"></script>
</body>
</html>
