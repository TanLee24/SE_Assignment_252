<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IoT-SPMS | Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#0a0e15",
                        "surface-container-low": "#0f131b",
                        "surface-container": "#1c2027",
                        "surface-container-high": "#262a32",
                        "surface-container-highest": "#31353d",
                        "on-surface": "#f1f3fe",
                        "on-surface-variant": "#a8abb5",
                        "primary": "#8eabff",
                        "primary-dim": "#2f6cf0",
                        "primary-container": "#2f6cf0",
                        "on-primary": "#002b75",
                        "outline-variant": "#444850",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "tertiary": "#00dbe7",
                    },
                    fontFamily: {
                        headline: ["Space Grotesk"],
                        body: ["Manrope"],
                    }
                },
            },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(49, 53, 61, 0.4);
            backdrop-filter: blur(24px);
        }
        .mesh-bg {
            background-color: #0a0e15;
            background-image:
                radial-gradient(at 0% 0%, rgba(47, 108, 240, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 219, 231, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 19, 27, 1) 0px, transparent 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="font-body bg-surface text-on-surface selection:bg-primary-container selection:text-white overflow-hidden">
    <div class="mesh-bg relative min-h-screen flex items-center justify-center p-6">
        <!-- Background Asset -->
        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
            <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBhwPrdGFb9g_ZMs8WJynDcAkJgT1gCTCgXZUZFaNmjavpj_7VOoWg5VRuaZkPGkj6V9oeZshKkyN9wJhwr2doUOJ3nljWsE9hM8Gmtb7NhfUv_N2rZIqpbn5nVfemnlNqs1oLQt-YC6DRdRwGGdkqG_TCfIOXDk7brtIevu59EOEeBcjOwMK1waxEIugahMM8RTmaPdcrew6qHOnrR2W1gFxVXrlI4L72E4X8S4sYPh-LrDxqTh5t5FmHKDfLPiDPtWuoykLWUiA" alt="Background"/>
        </div>

        <!-- Login Container -->
        <main class="relative z-10 w-full max-w-[480px]">
            <!-- Brand -->
            <div class="flex flex-col items-center mb-10">
                <div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-lg flex items-center justify-center shadow-[0px_0px_30px_rgba(47,108,240,0.4)] mb-4">
                    <span class="material-symbols-outlined text-white text-4xl">local_parking</span>
                </div>
                <h1 class="font-headline font-bold text-3xl tracking-tight bg-gradient-to-r from-primary to-primary-container bg-clip-text text-transparent">
                    IoT-SPMS
                </h1>
                <p class="text-on-surface-variant text-sm tracking-widest uppercase mt-2">Hệ thống Quản lý Bãi đỗ xe Thông minh</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card rounded-xl p-8 md:p-12 shadow-[0px_40px_80px_rgba(0,0,0,0.5)]">
                <header class="mb-8">
                    <h2 class="font-headline text-2xl font-bold text-on-surface mb-2">Đăng nhập</h2>
                    <p class="text-on-surface-variant text-sm">Xác thực qua HCMUT_SSO để truy cập hệ thống.</p>
                </header>

                <form class="space-y-6" id="loginForm" onsubmit="return handleLogin(event)">
                    <!-- Username -->
                    <div class="space-y-2">
                        <label class="font-body text-xs font-bold uppercase tracking-wider text-on-surface-variant block ml-1" for="username">Tên đăng nhập</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">person</span>
                            <input class="w-full bg-surface-container-highest border border-outline-variant/15 rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all" id="username" placeholder="admin" required type="text" autocomplete="username"/>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="font-body text-xs font-bold uppercase tracking-wider text-on-surface-variant block ml-1" for="password">Mật khẩu</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
                            <input class="w-full bg-surface-container-highest border border-outline-variant/15 rounded-md py-4 pl-12 pr-12 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all" id="password" placeholder="••••••••••••" required type="password" autocomplete="current-password"/>
                            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button" onclick="togglePassword()">
                                <span class="material-symbols-outlined" id="togglePwdIcon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="pt-4">
                        <button type="submit" id="loginBtn" class="w-full h-14 rounded-full bg-gradient-to-br from-primary-dim to-primary text-on-primary font-bold tracking-wide shadow-[0px_8px_20px_rgba(47,108,240,0.3)] hover:shadow-[0px_0px_25px_rgba(47,108,240,0.5)] active:scale-95 transition-all flex items-center justify-center gap-2 group">
                            <span id="btnText">Đăng nhập</span>
                            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" id="btnIcon" style="font-variation-settings: 'FILL' 1;">bolt</span>
                        </button>
                    </div>
                </form>

                <!-- Error Message -->
                <div class="hidden mt-6 p-4 rounded-md bg-error-container/20 border border-error/20 flex items-center gap-3" id="errorMessage">
                    <span class="material-symbols-outlined text-error">error</span>
                    <p class="text-error text-xs font-medium" id="errorText">Sai tên đăng nhập hoặc mật khẩu.</p>
                </div>

                <!-- Demo hint -->
                <div class="mt-6 p-4 rounded-md bg-surface-container-high/60">
                    <p class="text-[10px] text-on-surface-variant uppercase tracking-widest font-bold mb-2">Tài khoản demo</p>
                    <div class="grid grid-cols-2 gap-2 text-xs text-on-surface-variant">
                        <div>
                            <span class="text-primary font-bold">Admin:</span>
                            <span class="font-mono">admin / admin123</span>
                        </div>
                        <div>
                            <span class="text-tertiary font-bold">User:</span>
                            <span class="font-mono">2153029 / stu123</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="mt-8 text-center">
                <p class="text-on-surface-variant/40 text-[10px] tracking-widest uppercase">
                    © 2026 HCMUT IoT-SPMS · Kinetic Pulse v3.4
                </p>
            </footer>
        </main>

        <!-- Ambient Glows -->
        <div class="absolute bottom-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="absolute top-[-10%] left-[-5%] w-[300px] h-[300px] bg-tertiary/10 rounded-full blur-[100px] pointer-events-none"></div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('togglePwdIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // If already logged in, redirect
        (function checkSession() {
            const raw = sessionStorage.getItem('spms_current_user');
            if (raw) {
                try {
                    const user = JSON.parse(raw);
                    if (user.role === 'admin') {
                        window.location.href = 'admin/admin_dashboard.html';
                    } else if (user.role === 'guard') {
                        window.location.href = 'guard/dashboard.html';
                    } else {
                        window.location.href = 'user/dashboard.html';
                    }
                } catch {}
            }
        })();

        // Handle login
        async function handleLogin(e) {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const errorBox = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Loading state
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.textContent = 'Đang xác thực...';
            btnIcon.textContent = 'sync';
            btnIcon.classList.add('animate-spin');
            errorBox.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Simulate network delay for realism
            await new Promise(r => setTimeout(r, 800));

            try {
                const res = await fetch('../data/users.json');
                if (!res.ok) throw new Error('Không thể tải dữ liệu người dùng.');
                const users = await res.json();

                const user = users.find(u => u.username === username && u.password === password);

                if (!user) {
                    // Login failed
                    errorText.textContent = 'Sai tên đăng nhập hoặc mật khẩu. Vui lòng thử lại.';
                    errorBox.classList.remove('hidden');
                    errorBox.classList.add('shake');
                    setTimeout(() => errorBox.classList.remove('shake'), 500);

                    btn.disabled = false;
                    btn.classList.remove('opacity-70', 'cursor-not-allowed');
                    btnText.textContent = 'Đăng nhập';
                    btnIcon.textContent = 'bolt';
                    btnIcon.classList.remove('animate-spin');
                    return;
                }

                // Login success - store session
                sessionStorage.setItem('spms_current_user', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    role: user.role,
                    fullName: user.fullName,
                    email: user.email,
                    department: user.department,
                    cardId: user.cardId,
                }));

                btnText.textContent = 'Thành công!';
                btnIcon.textContent = 'check';
                btnIcon.classList.remove('animate-spin');
                btn.classList.remove('opacity-70');
                btn.classList.add('from-[#008188]', 'to-[#00dbe7]');

                await new Promise(r => setTimeout(r, 500));

                // Redirect based on role
                if (user.role === 'admin') {
                    window.location.href = 'admin/admin_dashboard.html';
                } else if (user.role === 'guard') {
                    window.location.href = 'guard/dashboard.html';
                } else {
                    window.location.href = 'user/dashboard.html';
                }

            } catch (err) {
                errorText.textContent = err.message || 'Đã xảy ra lỗi. Vui lòng thử lại.';
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnText.textContent = 'Đăng nhập';
                btnIcon.textContent = 'bolt';
                btnIcon.classList.remove('animate-spin');
            }
        }
    </script>
</body>
</html>
