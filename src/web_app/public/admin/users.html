<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản lý Người dùng | HCMUT Smart Parking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "surface": "#10131b", "surface-container-lowest": "#0a0e15",
                    "surface-container-low": "#181c23", "surface-container": "#1c2027",
                    "surface-container-high": "#262a32", "surface-container-highest": "#31353d",
                    "surface-variant": "#31353d", "surface-bright": "#353941",
                    "on-surface": "#dfe2ed", "on-surface-variant": "#c3c6d7",
                    "primary": "#b3c5ff", "primary-container": "#2f6cf0",
                    "on-primary": "#002b75", "on-primary-container": "#fffcff",
                    "outline-variant": "#424654", "outline": "#8d90a0",
                    "tertiary": "#00dbe7", "tertiary-container": "#008188",
                    "error": "#ffb4ab", "error-container": "#93000a",
                    "secondary": "#b3c5ff", "secondary-container": "#244592",
                    "background": "#10131b",
                },
                fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"], label: ["Manrope"] }
            }}
        }
    </script>
    <style>
        body { background-color: #10131b; color: #dfe2ed; font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .glass-card { background: rgba(49, 53, 61, 0.4); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden">

<!-- Top Navigation -->
<header id="admin-nav" class="fixed top-0 w-full z-50 bg-[#10131b]/80 backdrop-blur-2xl border-b border-[#424654]/15 shadow-[0px_20px_40px_rgba(47,108,240,0.08)]"></header>

<main class="pt-24 lg:pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-[1920px] mx-auto min-h-screen">
    <header class="mb-8 lg:mb-10">
        <h1 class="font-headline text-3xl sm:text-4xl lg:text-5xl font-bold mb-2 tracking-tight">Quản lý <span class="bg-gradient-to-r from-[#b3c5ff] to-[#2f6cf0] bg-clip-text text-transparent">Người dùng</span></h1>
        <p class="text-on-surface-variant font-body text-sm lg:text-base">Quản lý thông tin, phân quyền và thẻ định danh cho tất cả thành viên trong hệ thống.</p>
    </header>

    <!-- Search & Actions -->
    <section class="mb-6 lg:mb-8 flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 sm:gap-4">
        <div class="relative flex-grow max-w-md group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/50">search</span>
            <input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline/50 border-none rounded-full py-3 pl-12 pr-6 focus:ring-2 focus:ring-primary/40 transition-all text-sm" id="searchInput" placeholder="Tìm theo MSSV, tên, email..." type="text" oninput="filterUsers()"/>
        </div>
        <select id="roleFilter" class="bg-surface-container-low text-on-surface border-none rounded-full py-3 px-6 text-sm focus:ring-2 focus:ring-primary/40" onchange="filterUsers()">
            <option value="">Tất cả vai trò</option>
            <option value="super_admin">Super Admin</option>
            <option value="admin">Admin</option>
            <option value="guard">Bảo vệ</option>
            <option value="staff">Cán bộ</option>
            <option value="student">Sinh viên</option>
        </select>
        <div class="sm:ml-auto text-sm text-on-surface-variant" id="userCount">— người dùng</div>
    </section>

    <!-- User Table -->
    <section class="bg-surface-container-lowest rounded-lg overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
            <div class="grid grid-cols-6 px-6 py-4 text-xs font-label uppercase tracking-widest text-outline min-w-[700px]">
            <div>ID / MSSV</div>
            <div>Họ tên</div>
            <div>Email</div>
            <div>Phòng ban</div>
            <div>Vai trò</div>
            <div class="text-right">Thao tác</div>
            </div>
            <div class="space-y-3 p-4 sm:p-6 min-w-[700px]" id="userTableBody">
                <div class="text-center text-on-surface-variant py-8">Đang tải...</div>
            </div>
        </div>
    </section>
</main>

<!-- Edit Role Modal -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md hidden" id="roleModal">
    <div class="w-full max-w-md rounded-2xl p-8 shadow-2xl border border-outline-variant/15 bg-[#181c23]">
        <h3 class="font-headline text-2xl font-bold mb-2">Cập nhật vai trò</h3>
        <p class="text-on-surface-variant text-sm mb-6">Gán vai trò mới cho <span class="text-primary font-bold" id="modalUserName">—</span>.</p>
        <input type="hidden" id="modalUserId"/>
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-label uppercase tracking-widest text-outline mb-2">Vai trò mới</label>
                <select id="modalRoleSelect" class="w-full bg-surface-container-highest border border-outline-variant/15 rounded-xl py-3.5 px-4 text-on-surface focus:ring-2 focus:ring-primary/50 outline-none transition-all">
                    <option value="super_admin">Super Admin</option>
                    <option value="admin">Admin</option>
                    <option value="guard">Bảo vệ</option>
                    <option value="staff">Cán bộ / Nhân viên</option>
                    <option value="student">Sinh viên</option>
                </select>
            </div>
            <div class="flex gap-4 pt-4">
                <button class="flex-1 py-3.5 px-6 rounded-xl border border-outline-variant/20 text-sm font-bold hover:bg-white/5 transition-all" onclick="closeModal()">Hủy</button>
                <button class="flex-1 py-3.5 px-6 rounded-xl bg-gradient-to-br from-[#2f6cf0] to-[#b3c5ff] text-on-primary font-bold text-sm hover:shadow-[0_0_30px_rgba(47,108,240,0.4)] active:scale-[0.98] transition-all" onclick="saveRole()">Lưu thay đổi</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer id="admin-footer" class="w-full py-6 mt-auto bg-[#0a0e15] border-t border-[#424654]/10"></footer>

<script src="shared.js"></script>
<script>
    let allUsers = [];

    (async function boot() {
        const user = requireAdmin();
        if (!user) return;
        renderAdminNav('users');
        renderAdminFooter();

        // Load users
        allUsers = await loadUsers() || [];

        // Merge any local role overrides
        const overrides = JSON.parse(localStorage.getItem('spms_role_overrides') || '{}');
        allUsers = allUsers.map(u => ({
            ...u,
            role: overrides[u.id] || u.role,
        }));

        renderTable(allUsers);
    })();

    function renderTable(users) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        document.getElementById('userCount').textContent = `${users.length} người dùng`;

        if (users.length === 0) {
            tbody.innerHTML = '<div class="text-center text-on-surface-variant py-8">Không tìm thấy người dùng.</div>';
            return;
        }

        users.forEach((u, i) => {
            const row = document.createElement('div');
            row.className = `grid grid-cols-6 items-center px-6 py-4 rounded-md hover:bg-surface-container-high transition-colors ${i % 2 === 0 ? 'bg-surface-container-low' : 'bg-surface-container-low/50'}`;
            row.setAttribute('data-user-id', u.id);

            row.innerHTML = `
                <div class="font-headline text-primary">${u.username || u.id}</div>
                <div class="font-body font-semibold">${u.fullName}</div>
                <div class="font-body text-sm text-on-surface-variant">${u.email}</div>
                <div class="font-body text-sm text-on-surface-variant">${u.department || '—'}</div>
                <div>${getRoleBadge(u.role)}</div>
                <div class="text-right flex items-center justify-end gap-2">
                    <button class="text-primary/60 hover:text-primary transition-all flex items-center gap-1 active:scale-95" onclick="openModal('${u.id}', '${u.fullName.replace(/'/g, "\\'")}', '${u.role}')">
                        <span class="material-symbols-outlined text-lg">edit</span>
                        <span class="text-xs font-bold">Sửa</span>
                    </button>
                </div>
            `;
            tbody.appendChild(row);
        });
    }

    function filterUsers() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const roleFilter = document.getElementById('roleFilter').value;

        const filtered = allUsers.filter(u => {
            const matchSearch = !q || u.username.toLowerCase().includes(q) || u.fullName.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.id.toLowerCase().includes(q);
            const matchRole = !roleFilter || u.role === roleFilter;
            return matchSearch && matchRole;
        });

        renderTable(filtered);
    }

    function openModal(userId, userName, currentRole) {
        document.getElementById('modalUserId').value = userId;
        document.getElementById('modalUserName').textContent = userName;
        document.getElementById('modalRoleSelect').value = currentRole;
        document.getElementById('roleModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('roleModal').classList.add('hidden');
    }

    function saveRole() {
        const userId = document.getElementById('modalUserId').value;
        const newRole = document.getElementById('modalRoleSelect').value;

        // Update local overrides
        const overrides = JSON.parse(localStorage.getItem('spms_role_overrides') || '{}');
        overrides[userId] = newRole;
        localStorage.setItem('spms_role_overrides', JSON.stringify(overrides));

        // Update in-memory
        const user = allUsers.find(u => u.id === userId);
        if (user) user.role = newRole;

        renderTable(allUsers);
        closeModal();
        showToast('Vai trò đã được cập nhật thành công!', 'success');
    }
</script>
</body>
</html>
