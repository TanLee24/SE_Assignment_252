<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nhật ký Hệ thống | HCMUT Smart Parking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "surface": "#10131b", "surface-container-lowest": "#0a0e15",
                    "surface-container-low": "#181c23", "surface-container": "#1c2027",
                    "surface-container-high": "#262a32", "surface-container-highest": "#31353d",
                    "surface-variant": "#31353d", "surface-bright": "#353941",
                    "on-surface": "#dfe2ed", "on-surface-variant": "#c3c6d7",
                    "primary": "#b3c5ff", "primary-container": "#2f6cf0",
                    "on-primary": "#002b75",
                    "outline-variant": "#424654", "outline": "#8d90a0",
                    "tertiary": "#00dbe7", "error": "#ffb4ab",
                    "secondary": "#b3c5ff", "secondary-container": "#244592",
                    "background": "#10131b",
                },
                fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"], label: ["Manrope"] }
            }}
        }
    </script>
    <style>
        body { background-color: #10131b; color: #dfe2ed; font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e15; }
        ::-webkit-scrollbar-thumb { background: #31353d; border-radius: 10px; }
    </style>
    <link href="../theme.css" rel="stylesheet"/>
    <script src="../theme.js"></script>
</head>
<body class="overflow-x-hidden">

<!-- Top Navigation -->
<header id="admin-nav" class="fixed top-0 w-full z-50 bg-[#10131b]/80 backdrop-blur-2xl border-b border-[#424654]/15 shadow-[0px_20px_40px_rgba(47,108,240,0.08)]"></header>

<main class="pt-24 lg:pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-[1920px] mx-auto min-h-screen">
    <div class="mb-8 lg:mb-10">
        <h1 class="font-headline font-bold text-3xl sm:text-4xl lg:text-5xl tracking-tight text-on-surface mb-2">Nhật ký <span class="bg-gradient-to-r from-[#b3c5ff] to-[#2f6cf0] bg-clip-text text-transparent">Hệ thống</span></h1>
        <p class="text-on-surface-variant text-sm lg:text-base max-w-2xl">Giám sát toàn bộ hoạt động hệ thống IoT-SPMS: xác thực, ra/vào, thanh toán, cảm biến và quản trị.</p>
    </div>

    <!-- Control Bar -->
    <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 sm:gap-4 mb-6 lg:mb-8">
        <div class="relative flex-grow max-w-md">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/50">search</span>
            <input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline/50 border-none rounded-full py-3 pl-12 pr-6 focus:ring-2 focus:ring-primary/40 transition-all text-sm" id="searchInput" placeholder="Tìm kiếm trong log..." type="text" oninput="filterLogs()"/>
        </div>
        <select id="levelFilter" class="bg-surface-container-low text-on-surface border-none rounded-full py-3 px-6 text-sm focus:ring-2 focus:ring-primary/40" onchange="filterLogs()">
            <option value="">Tất cả mức độ</option>
            <option value="info">INFO</option>
            <option value="success">SUCCESS</option>
            <option value="warning">WARNING</option>
            <option value="error">ERROR</option>
        </select>
        <select id="moduleFilter" class="bg-surface-container-low text-on-surface border-none rounded-full py-3 px-6 text-sm focus:ring-2 focus:ring-primary/40" onchange="filterLogs()">
            <option value="">Tất cả module</option>
            <option value="system">System</option>
            <option value="auth">Auth</option>
            <option value="access_control">Access Control</option>
            <option value="pricing">Pricing</option>
            <option value="admin">Admin</option>
            <option value="iot_monitoring">IoT Monitoring</option>
            <option value="access_control">Kiểm soát ra/vào</option>
        </select>
        <div class="sm:ml-auto text-sm text-on-surface-variant" id="logCount">— bản ghi</div>
    </div>

    <!-- Logs Table -->
    <section class="bg-surface-container-lowest rounded-lg overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left min-w-[800px]">
                <thead>
                    <tr class="bg-surface-container-highest/30">
                        <th class="px-6 py-5 text-[10px] uppercase tracking-widest text-outline font-bold w-[180px]">Thời gian</th>
                        <th class="px-6 py-5 text-[10px] uppercase tracking-widest text-outline font-bold w-[100px]">Mức độ</th>
                        <th class="px-6 py-5 text-[10px] uppercase tracking-widest text-outline font-bold w-[130px]">Module</th>
                        <th class="px-6 py-5 text-[10px] uppercase tracking-widest text-outline font-bold w-[120px]">Tác nhân</th>
                        <th class="px-6 py-5 text-[10px] uppercase tracking-widest text-outline font-bold">Chi tiết</th>
                    </tr>
                </thead>
                <tbody id="logTableBody" class="divide-y divide-outline-variant/10">
                    <tr><td colspan="5" class="px-6 py-8 text-center text-on-surface-variant">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Stats Grid -->
    <div class="grid grid-cols-12 gap-6 mt-10">
        <div class="col-span-12 md:col-span-4 bg-surface-container-low p-8 rounded-lg">
            <p class="text-[10px] uppercase tracking-widest text-outline mb-4 font-bold">Tổng bản ghi</p>
            <h3 class="text-4xl font-headline text-primary" id="statTotal">—</h3>
        </div>
        <div class="col-span-12 md:col-span-4 bg-surface-container-low p-8 rounded-lg">
            <p class="text-[10px] uppercase tracking-widest text-outline mb-4 font-bold">Cảnh báo & Lỗi</p>
            <h3 class="text-4xl font-headline text-error" id="statErrors">—</h3>
        </div>
        <div class="col-span-12 md:col-span-4 bg-surface-container-low p-8 rounded-lg">
            <p class="text-[10px] uppercase tracking-widest text-outline mb-4 font-bold">Module hoạt động nhiều nhất</p>
            <h3 class="text-4xl font-headline text-tertiary" id="statTopModule">—</h3>
        </div>
    </div>
</main>

<!-- Footer -->
<footer id="admin-footer" class="w-full py-6 mt-auto bg-[#0a0e15] border-t border-[#424654]/10"></footer>

<script src="shared.js"></script>
<script>
    let allLogs = [];

    (async function boot() {
        const user = requireAdmin();
        if (!user) return;
        renderAdminNav('logs');
        renderAdminFooter();

        allLogs = await loadAuditLog() || [];
        renderLogs(allLogs);
        renderStats(allLogs);
    })();

    function renderLogs(logs) {
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';
        document.getElementById('logCount').textContent = `${logs.length} bản ghi`;

        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-on-surface-variant">Không tìm thấy bản ghi.</td></tr>';
            return;
        }

        // Show newest first
        const sorted = [...logs].reverse();

        sorted.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-surface-bright transition-colors';
            tr.innerHTML = `
                <td class="px-6 py-4 text-sm text-on-surface font-medium whitespace-nowrap">${formatDateTime(log.timestamp)}</td>
                <td class="px-6 py-4">${getLevelBadge(log.level)}</td>
                <td class="px-6 py-4">
                    <span class="text-xs text-on-surface-variant font-mono">${log.module}</span>
                </td>
                <td class="px-6 py-4">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-[10px] text-primary">${log.actor.substring(0, 2).toUpperCase()}</div>
                        <span class="text-sm text-on-surface">${log.actor}</span>
                    </div>
                </td>
                <td class="px-6 py-4 text-sm text-on-surface-variant">${log.detail}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterLogs() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const levelFilter = document.getElementById('levelFilter').value;
        const moduleFilter = document.getElementById('moduleFilter').value;

        const filtered = allLogs.filter(log => {
            const matchSearch = !q || log.detail.toLowerCase().includes(q) || log.actor.toLowerCase().includes(q) || log.action.toLowerCase().includes(q);
            const matchLevel = !levelFilter || log.level === levelFilter;
            const matchModule = !moduleFilter || log.module === moduleFilter;
            return matchSearch && matchLevel && matchModule;
        });

        renderLogs(filtered);
    }

    function renderStats(logs) {
        document.getElementById('statTotal').textContent = logs.length;

        const errWarn = logs.filter(l => l.level === 'error' || l.level === 'warning').length;
        document.getElementById('statErrors').textContent = errWarn;

        // Find top module
        const moduleCounts = {};
        logs.forEach(l => {
            moduleCounts[l.module] = (moduleCounts[l.module] || 0) + 1;
        });
        const topModule = Object.entries(moduleCounts).sort((a, b) => b[1] - a[1])[0];
        document.getElementById('statTopModule').textContent = topModule ? topModule[0].replace(/_/g, ' ') : '—';
    }
</script>
</body>
</html>
